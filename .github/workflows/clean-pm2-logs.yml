name: Clean pm2 logs

# One-off, dispatch-only. The host has no SSH access, so the runner is the only
# way in. Remove this file once the logs are clean and rotation is confirmed
# active (same shape as d986062 / d128501).
#
# Why: the pm2 error log had reached 117 MB and had never been rotated, and about
# 1.9M of its 1,925,156 lines belong to a DIFFERENT application - the legacy
# portal, which ran under the same pm2 app name (mysql2, a `/api/users/login/...`
# route, 74,693 copies of `Unknown column 'r.hiererarchy'`). None of that exists in
# this repository. This log is the only telemetry the host exposes, and its size,
# its binary bytes and another application's failures are what made the 2026-08-06
# avatar-proxy diagnosis cost an entire session.
#
# The tail is archived before anything is emptied, and rotation is installed after:
# an unrotated log is the root cause here, so emptying it once would only reset the
# clock. Prints no secret - this repository is public.

on:
  workflow_dispatch:

jobs:
  clean:
    name: Clean
    runs-on: self-hosted
    steps:
      - name: Sizes before
        run: ls -la ~/.pm2/logs/

      - name: Archive the recent tail before emptying anything
        # 20k lines covers the whole portal-era tail, including the 479 avatar
        # failures, for a few hundred kilobytes compressed. What is dropped is the
        # legacy application's bulk, which no one will ever read.
        run: |
          mkdir -p ~/pm2-archive
          stamp=$(date +%Y%m%d-%H%M%S)
          tail -n 20000 ~/.pm2/logs/portail-etu-error.log \
            | gzip > ~/pm2-archive/portail-etu-error-"$stamp".log.gz
          ls -la ~/pm2-archive/

      - name: Empty through pm2 rather than rm
        # `rm` on a file pm2 holds open frees no space until the process restarts,
        # and leaves it writing to a deleted inode. `pm2 flush` truncates the
        # descriptors pm2 owns, which is the only safe way while the app runs.
        run: |
          pm2 flush portail-etu || pm2 flush
          ls -la ~/.pm2/logs/

      - name: Rotate from now on, so the size cannot come back
        # Retried: the first attempt died on `ConnectionRefused downloading package
        # manifest`, which is this host's intermittent outbound failure - the same
        # class as the avatar proxy's `Unable to connect`, from the same runtime,
        # while curl succeeded in the same run. So the install is not reliable here
        # on one try, and a silent failure would leave the log growing again.
        run: |
          installed=""
          for attempt in 1 2 3 4 5; do
            if pm2 install pm2-logrotate; then installed=yes; break; fi
            echo "attempt $attempt failed - retrying (host outbound connections are intermittent)"
            sleep 20
          done
          if [ -z "$installed" ]; then echo "pm2-logrotate install FAILED - rotation NOT active"; fi
          pm2 set pm2-logrotate:max_size 10M
          pm2 set pm2-logrotate:retain 5
          pm2 set pm2-logrotate:compress true
          pm2 conf pm2-logrotate || true

      - name: State after
        run: |
          pm2 list --no-color
          ls -la ~/.pm2/logs/
