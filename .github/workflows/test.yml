name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # `deploy.yml` calls this as its `verify` job on the dispatch path. A squash merge made with
  # GITHUB_TOKEN raises no `push`, so the auto-merge sweep has to dispatch the deploy - and a
  # dispatch that skipped this would deploy a COMBINATION of updates nothing ever tested together.
  workflow_call:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `.github/scripts/` is the only code in this repository that MERGES things, so it is linted
      # rather than merely parsed, and before a merge rather than after one. The linter was run
      # against all four repositories carrying these scripts before this step existed - a gate
      # nobody ran is how a pipeline goes red for a reason nobody changed - and it named exactly
      # one thing, SC1091, the sourced file it cannot resolve through `$(dirname "$0")`; the
      # `source-path=SCRIPTDIR` directives beside each `.` answer it. `-x` makes it follow the
      # source. It was also proved able to fail: an unquoted `rm $f` spliced into the library came
      # back as SC2086.
      #
      # THE VERSION IS PINNED AND THE RUNNER'S OWN COPY IS IGNORED. `ubuntu-latest` ships a
      # shellcheck, but which one is the image's business and it moves without this repository
      # changing - a floating linter is the same defect as an unverified one, arriving later. The
      # digest is of the archive that produced the run described above, so CI lints with the binary
      # whose verdict was actually read.
      - name: Lint the CI scripts
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -sSLf -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" -x \
            .github/scripts/*.sh .github/scripts/lib/*.sh .github/scripts/tests/*.sh

      # Pin the Bun version so CI, the deploy runner and a fresh clone all
      # resolve the same toolchain. Must be >= 1.2 to read the text bun.lock.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate SvelteKit files
        run: bunx svelte-kit sync

      - name: Linting
        run: bun run lint

      # oxvelte is a Rust binary built from a pinned revision, and ubuntu-latest ships a Rust
      # toolchain, so the only thing needed here is to not rebuild it on every run. The key names
      # the revision: a key naming the version restores whichever binary was built first and means
      # several different linters under one name. Move both together or CI lints with the old one.
      - name: Cache oxvelte build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/oxvelte
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: oxvelte-7196779a-${{ runner.os }}

      # oxlint reads the <script> block of a .svelte file and not the template. The template half
      # is a separate linter, so a Svelte-only regression needs a step of its own to be seen.
      - name: Linting Svelte templates
        run: bun run lint:svelte

      - name: Code Style Check
        run: bun run format:check

      - name: Type Check
        run: bun run check

      - name: Run tests
        run: bun run test

      # Build in CI too: the deploy workflow builds, so a broken production
      # build must fail here (and in the pre-push hook) rather than only at deploy.
      - name: Build
        run: bun run build

      # A BUILD IS NOT A BOOT. The step above proves `svelte-adapter-bun` produced
      # something; it proves nothing about whether the thing it produced starts. The
      # only place that was ever checked is `deploy.yml`'s "Verify the app actually
      # answers" - which is real, and which runs AFTER pm2 has already restarted
      # production with the broken build. That is a report, not a gate.
      #
      # So the same question is asked here, where the answer costs a red pull request
      # instead of an outage. No `.env` is written: the app must start from nothing,
      # which is also what proves the defaults are complete.
      #
      # The log is printed on failure because a server that exits during startup says
      # why exactly once, on its own stdout, and the runner is the only reader.
      - name: Boot the packaged server
        run: |
          set -euo pipefail
          PORT=3399 bun ./build/index.js > /tmp/boot.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3399/ || true)
            if [ "$code" = "200" ]; then
              echo "The packaged server answered 200 on attempt ${attempt}."
              kill "$pid" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "::error::The packaged server never answered. Last status: ${code:-none}."
          cat /tmp/boot.log || true
          kill "$pid" 2>/dev/null || true
          exit 1
