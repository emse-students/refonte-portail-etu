name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # `deploy.yml` calls this as its `verify` job on the dispatch path. A squash merge made with
  # GITHUB_TOKEN raises no `push`, so the auto-merge sweep has to dispatch the deploy - and a
  # dispatch that skipped this would deploy a COMBINATION of updates nothing ever tested together.
  workflow_call:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # WHAT IS LINTED MOVED ON 2026-09-04, AND THE STEP STAYED. It read `.github/scripts/`, which
      # held the auto-merge sweep and nothing else; that whole mechanism is deleted, and `scripts/`
      # is what is left - the oxvelte install and shim, which every contributor and every CI run
      # executes. A gate pointed at a directory that no longer exists fails on the directory rather
      # than on the code, which reads like a broken pipeline instead of a missing check.
      #
      # THE VERSION IS PINNED AND THE RUNNER'S OWN COPY IS IGNORED. `ubuntu-latest` ships a
      # shellcheck, but which one is the image's business and it moves without this repository
      # changing - a floating linter is the same defect as an unverified one, arriving later. The
      # digest is of the archive that produced the run described above, so CI lints with the binary
      # whose verdict was actually read.
      - name: Lint the CI scripts
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -sSLf -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" -x \
            scripts/*.sh .github/scripts/*.sh .github/scripts/tests/*.sh

      # AND THE ONE SHELL SCRIPT WITH A DECISION IN IT IS RUN, not merely parsed.
      # `audit-dependencies.sh` classifies an npm 503 as "no verdict" and a real advisory as a
      # finding, from the SAME exit code - a distinction that is either asserted on both sides
      # or is a comment. The test needs no network: it runs the real script against a fake
      # `bun` on `PATH`, which is what makes the outage case reproducible when the incident
      # itself was not.
      - name: Test the audit classifier
        run: bash .github/scripts/tests/audit-dependencies.test.sh

      # Pin the Bun version so CI, the deploy runner and a fresh clone all
      # resolve the same toolchain. Must be >= 1.2 to read the text bun.lock.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate SvelteKit files
        run: bunx svelte-kit sync

      - name: Linting
        run: bun run lint

      # oxvelte is a Rust binary built from a pinned revision, and ubuntu-latest ships a Rust
      # toolchain, so the only thing needed here is to not rebuild it on every run. The key names
      # the revision: a key naming the version restores whichever binary was built first and means
      # several different linters under one name. Move both together or CI lints with the old one.
      - name: Cache oxvelte build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/oxvelte
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: oxvelte-7196779a-${{ runner.os }}

      # oxlint reads the <script> block of a .svelte file and not the template. The template half
      # is a separate linter, so a Svelte-only regression needs a step of its own to be seen.
      - name: Linting Svelte templates
        run: bun run lint:svelte

      - name: Code Style Check
        run: bun run format:check

      - name: Type Check
        run: bun run check

      - name: Run tests
        run: bun run test

      # Build in CI too: the deploy workflow builds, so a broken production
      # build must fail here (and in the pre-push hook) rather than only at deploy.
      - name: Build
        run: bun run build

      # A BUILD IS NOT A BOOT. The step above proves `svelte-adapter-bun` produced
      # something; it proves nothing about whether the thing it produced starts. The
      # only place that was ever checked is `deploy.yml`'s "Verify the app actually
      # answers" - which is real, and which runs AFTER pm2 has already restarted
      # production with the broken build. That is a report, not a gate.
      #
      # So the same question is asked here, where the answer costs a red pull request
      # instead of an outage. No `.env` is written: the app must start from nothing,
      # which is also what proves the defaults are complete.
      #
      # The log is printed on failure because a server that exits during startup says
      # why exactly once, on its own stdout, and the runner is the only reader.
      - name: Boot the packaged server
        run: |
          set -euo pipefail
          PORT=3399 bun ./build/index.js > /tmp/boot.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3399/ || true)
            if [ "$code" = "200" ]; then
              echo "The packaged server answered 200 on attempt ${attempt}."
              kill "$pid" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "::error::The packaged server never answered. Last status: ${code:-none}."
          cat /tmp/boot.log || true
          kill "$pid" 2>/dev/null || true
          exit 1

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # THE SECURITY PASS, AND IT CAN NOW STOP A MERGE
  #
  # CodeQL, the TruffleHog secret scan and the rest ran on every pull request from their own
  # workflow until 2026-09-04 - and could not block one, because nothing required them. They are now
  # a called job of this workflow, so they reach `CI passed` below, which is the check the branch
  # ruleset requires. THE PERMISSIONS ARE DERIVED FROM WHAT THE CALLEE DECLARES: a caller caps a
  # called workflow, and exceeding that cap is a startup failure with no log and no annotation.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  security:
    name: Security
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/code-analysis.yml

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # THE ONE CHECK A RULESET CAN REQUIRE
  #
  # A rule naming an individual job would name one whose presence can change; this one exists on
  # every run of this workflow and reads the others' results. `success` AND `skipped` both pass - a
  # skipped job is one with nothing to do, and treating that as a failure is how a required check
  # becomes a wall.
  #
  # IT MUST HAVE `if: always()`. Without it a failed dependency SKIPS this job, and a skipped
  # required check never reports at all: the pull request waits for ever on a green tick that is not
  # coming, which reads exactly like a slow runner.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Did everything pass?
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          failed="$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed" ]; then
            echo "::error::CI did not pass:"
            echo "$failed"
            exit 1
          fi
          echo "every CI job passed or was skipped as having nothing to do"
