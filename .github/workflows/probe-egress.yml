name: Probe egress

# Measures what the DEPLOY HOST can reach, from the deploy host itself.
#
# `src/routes/+layout.ts` sets `ssr = false`, and the reason written down is that
# "the deploy host cannot reach canari-emse.fr from the server (hairpin NAT: the
# portal and Canari sit behind the same public IP)". That reason no longer
# describes the network: `canari-emse.fr` resolves to Cloudflare anycast
# (104.21.10.94 / 172.67.162.196) while `portail-etu.emse.fr` is 193.49.175.67,
# so a server-side request leaves for Cloudflare rather than hairpinning back
# through the portal's own NAT.
#
# Whether it actually works is a separate question from whether that reason
# holds, and it decides everything about this site's `<head>`: with `ssr = false`
# a crawler and every link unfurler see an empty shell, because `<svelte:head>`
# never runs. Restoring SSR is the whole fix - if the data is reachable.
#
# The self-hosted runner IS the deploy box (it copies its build into
# `~/portail-etu` and pm2-restarts it there), so what this measures is exactly
# what the app would get.
#
# Dispatch-only, and it deploys nothing. THIS REPOSITORY IS PUBLIC: the probe
# prints status codes, byte counts and timings only - never a response body,
# never a header, never an environment value.

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe
    runs-on: self-hosted
    steps:
      - name: Resolve and reach the Canari public API
        run: |
          set +e
          probe() {
            label="$1"
            url="$2"
            # -o /dev/null so no body is ever written to a public log.
            out=$(curl -sS -o /dev/null -m 10 \
              -w 'status=%{http_code} bytes=%{size_download} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s' \
              "$url" 2>&1)
            echo "[$label] $out"
          }

          echo "--- what this host resolves ---"
          getent hosts canari-emse.fr || echo "canari-emse.fr does not resolve here"
          getent hosts portail-etu.emse.fr || echo "portail-etu.emse.fr does not resolve here"

          echo "--- what this host can reach ---"
          probe "canari-public-associations" "https://canari-emse.fr/api/public/associations?type=association"
          probe "canari-version" "https://canari-emse.fr/api/version"
          # A control: if this fails too, the finding is "no egress at all", which
          # is a different diagnosis and a different fix.
          probe "control-cloudflare" "https://1.1.1.1/"
