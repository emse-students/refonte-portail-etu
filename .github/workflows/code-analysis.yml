name: Code Analysis

# This repository had NO static analysis and NO secret scanning until 2026-08-26, while being
# PUBLIC and while carrying the largest vulnerability debt of the five projects (29 advisories,
# 21 of them high, measured that day). It was also the only one of the four GitHub repos without
# this workflow - Canari, Sky and MiGallery have had it for months.
#
# Everything runs on GitHub-hosted runners. The self-hosted runner is the deploy path and the only
# way into that box; analysis has no business there, and a CodeQL database is large enough that
# building it on the deploy host would compete with the thing it is meant to protect.

# CALLED BY `ci.yml` AND BY `scheduled.yml`, AND BY NOTHING ELSE, since 2026-09-04. It used to
# carry its own `pull_request` and `schedule` triggers, which put its verdict OUTSIDE the check a
# merge waits on: CodeQL, the secret scan and the vulnerability audit all ran on every pull request
# and could not block a single one. A red tick nothing enforces is worse than no tick, because it
# looks enforced - and this repository is PUBLIC and carried the largest advisory debt of the five.
#
# `ci.yml` calls it as a job feeding `CI passed`; `scheduled.yml` calls the same file nightly,
# which is the half a pull request cannot see - a new advisory landing against code nobody touched.
#
# ITS PERMISSIONS ARE PER JOB, and the caller must grant at least as much: a called workflow cannot
# be given more than its caller grants it, and exceeding that is a STARTUP FAILURE - no job runs, no
# log, no annotation.
on:
  workflow_call:
    inputs:
      # WHAT AN UNREACHABLE npm ADVISORY ENDPOINT COSTS, AND IT IS NOT THE SAME IN BOTH CALLERS.
      # `bun audit` exits 1 for a 503 exactly as it does for a real advisory, and on 2026-09-03 that
      # walled every merge in Canari behind a five-minute npm outage - the same defect lives in every
      # repository that runs this job. A pull request must not be stopped by an incident nobody here
      # can fix; the nightly pass must, because that failure IS the report that a tree has gone a day
      # unaudited. `audit-dependencies.sh` carries the classification, this input carries the policy.
      registry_outage_is_failure:
        description: "Fail when the npm advisory endpoint never answers. `true` for the nightly pass, `false` for a pull request."
        required: false
        default: false
        type: boolean

jobs:
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `javascript-typescript` is ONE language in CodeQL, not two: `typescript` is an alias of
      # `javascript`, so a matrix naming both runs the identical analysis twice and files every
      # finding twice. MiGallery did exactly that until the same day this file was written.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended, security-and-quality

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      # Non-fatal, and LOUD when it fails. CodeQL reads JavaScript and TypeScript from source; a
      # missing node_modules costs import resolution, not the run. What it must never do is fail
      # silently, which is how an install that has been broken for months reads like a clean one.
      - name: Install dependencies
        run: bun install --frozen-lockfile
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No `continue-on-error`. `--only-verified` means TruffleHog authenticated the credential
      # against its provider before reporting it, so a finding is a LIVE secret in a PUBLIC
      # repository - not a string that resembles one. The build fails and the credential is
      # rotated. This repo already treats its run logs as publishable; this is the same rule
      # applied to its history.
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.97.2
        with:
          path: ./
          extra_args: --debug --only-verified

  dependencies:
    name: Check Dependencies Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A real gate, red when it should be red. It can fail on a morning nobody pushed anything -
      # that is what it is for, and `.github/dependabot.yml` opens the pull request that fixes it.
      #
      # IT GOES THROUGH `audit-dependencies.sh`, WHICH IS THE ONE PLACE THAT TELLS THE REGISTRY'S
      # ANSWER APART FROM ITS SILENCE. `|| [ "$?" -eq 2 ]` is where this caller's policy lands: a 2
      # means npm never answered, which is not a verdict about this tree. The script turns that 2
      # into a 1 by itself when the input above says an unaudited tree is a failure - which is what
      # the nightly pass asks for, and a pull request does not.
      - name: Audit dependencies
        env:
          REGISTRY_OUTAGE_IS_FAILURE: ${{ inputs.registry_outage_is_failure }}
        run: |
          set -uo pipefail
          .github/scripts/audit-dependencies.sh . || [ "$?" -eq 2 ]
