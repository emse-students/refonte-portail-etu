# =================================================================================================
# DEPLOY THE PORTAL - A LIBRARY, CALLED ONLY BY `release.yml`
#
# NO TRIGGERS OF ITS OWN, AND NO ROW OF ITS OWN IN THE ACTIONS LIST, since 2026-09-04. It fired on
# `workflow_run` after `Run Tests` finished on `main`, which made every merge a deployment:
# production was whatever the last green pull request happened to be, and nobody chose it.
# **Nothing deploys on a push any more** - `release.yml` is the only caller, in every repository of
# the ecosystem.
#
# ITS `verify` JOB IS GONE WITH THE DISPATCH PATH THAT NEEDED IT. That job re-ran the whole suite,
# because a dispatch could otherwise deploy a combination nothing had tested together. The release
# preflight READS the verdict that already exists on the commit instead - cheaper, and stricter,
# because it also refuses an ABSENT check, which a re-run cannot even notice.
#
# AND `skip_ci` IS GONE WITH IT. It was the escape hatch for the 2026-08-06 Actions outage that
# dropped the push triggers; the release path has no push trigger to lose, and a flag that skips the
# only evidence a deploy has is a fallback path - reaching one means the primary path failed, and
# the fix belongs there.
#
# IT IS HANDED A COMMIT AND A VERSION rather than working them out. The caller has already put them
# through the gates; recomputing them here would be a second opinion about what is being shipped.
# =================================================================================================
name: Deploy

on:
  workflow_call:
    inputs:
      sha:
        description: "The commit to build and ship. Resolved and gated by the caller."
        required: true
        type: string
      version:
        description: "The version being released, without a leading `v`. Recorded in the run log."
        required: true
        type: string

permissions:
  contents: read

jobs:
  # NO `if:` AND NO `needs:`, and that is the point of being a library. Every condition this job
  # used to carry was about which trigger had fired and whether some other run had gone green; a
  # called workflow runs because its caller decided it should, and the caller's gates are the
  # condition.
  deploy:
    name: Deploy
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The commit the caller gated, never `github.sha` - which on a `release` event is the tag
          # and on a dispatch is whatever the branch happens to be by then.
          ref: ${{ inputs.sha }}

      - name: Paste files to right location
        run: |
          cd ~/portail-etu
          # Wipe everything, including any stale hand-written .env: runtime
          # config is rewritten from GitHub Secrets further down, so the server
          # keeps no manual state and a fresh machine deploys identically. `cp -a
          # SRC/.` (not `SRC/*`) so dotfiles - Dockerfile's neighbour
          # `.dockerignore` in particular - actually make the trip.
          #
          # THE SOURCE IS `$GITHUB_WORKSPACE`, NEVER A PATH SPELLED OUT HERE. It used to read
          # `~/actions-runner/_work/refonte-portail-etu/refonte-portail-etu`, which encoded three
          # things this file has no business knowing: where the runner is installed, whose home it
          # sits in, and how Actions lays out `_work`. All three moved the day the runner left a
          # personal account for the `gha-runner` service account, and none of them is a fact about
          # this deploy. Actions already hands the checkout directory over in this variable.
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${GITHUB_WORKSPACE}/." .

      # `oven/bun` resolves to the `x64-baseline` build on every amd64 host,
      # unconditionally - the safe default regardless of what the host CPU
      # advertises, and the reason no install step of Bun's own belongs on this
      # runner any more: everything from `bun install` to `bun run build` now runs
      # inside the container build, on the pinned image (see `.bun-version` and
      # docs/wiki/deployment.md for what that pin is and why it moves).
      - name: Build the Docker image
        run: |
          cd ~/portail-etu
          docker compose build

      - name: Write runtime environment from GitHub Secrets
        # Secrets are passed via env (masked in logs) rather than interpolated
        # into the script body. `docker-compose.yml` loads ~/portail-etu/.env at
        # container start via `env_file`, so the container reads these without a
        # rebuild - the image itself never sees a secret. Empty values are safe:
        # the app code falls back to public defaults for the URLs and disables
        # the avatar proxy when GALLERY_API_KEY is unset.
        env:
          PUBLIC_CANARI_URL: ${{ secrets.PUBLIC_CANARI_URL }}
          GALLERY_API_URL: ${{ secrets.GALLERY_API_URL }}
          GALLERY_API_KEY: ${{ secrets.GALLERY_API_KEY }}
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
        run: |
          cd ~/portail-etu
          cat > .env <<EOF
          PUBLIC_CANARI_URL=${PUBLIC_CANARI_URL}
          GALLERY_API_URL=${GALLERY_API_URL}
          GALLERY_API_KEY=${GALLERY_API_KEY}
          PORTAL_URL=${PORTAL_URL}
          EOF

      - name: Restart server
        run: |
          cd ~/portail-etu
          # --force-recreate: the image tag never changes between deploys (it's
          # always "the code just built"), so without it Compose could decide
          # nothing about the container's config changed and leave the old one
          # running on the old image - the same silent no-op `pm2 restart` never
          # had, since pm2 always re-execs the script it's given.
          docker compose up -d --force-recreate --remove-orphans

      # A deploy that only starts the container proves nothing. On 2026-08-26
      # every step here reported success while the site served 502: pm2 printed
      # `online` the instant it spawned, so a process that crashed a second later
      # still left a green deploy behind, and the restart counter was the only
      # thing on that table that gave it away. Docker's own healthcheck-less `up`
      # is exactly as easy to fool.
      #
      # This step is the report the deploy never had. It asks the app the one
      # question the whole deploy exists to answer - does it serve? - and when it
      # does not, it prints the crash that nothing else on this box can show,
      # because the runner is the only way in.
      - name: Verify the app actually answers
        run: |
          cd ~/portail-etu
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/ || true)
            if [ "$code" = "200" ]; then
              echo "The app answered 200 on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code:-none}, retrying in 3s..."
            sleep 3
          done

          echo "::error::The app never answered 200. Last status: ${code:-none}."
          # `docker compose ps` is the restart counter pm2's table used to be -
          # not evidence that anything serves, but evidence of how it failed.
          # `--timestamps` replaces pm2's `time: true`, which is what let the
          # 2026-08-26 diagnosis place 479 avatar-proxy failures in time at all
          # instead of reading as one chronic fault. There is no SSH to this box -
          # printing them here is the only way anyone sees them.
          docker compose ps 2>&1 || true
          docker compose logs --no-color --timestamps --tail 30 2>&1 |
            grep -av -iE '(secret|token|password|api[_-]?key|authorization|bearer)' || true
          exit 1
