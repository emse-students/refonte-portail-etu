name: Deploy to Server

on:
  workflow_run:
    workflows: ["Run Tests"]
    branches: [main]
    types:
      - completed
  # Manual escape hatch. On 2026-08-06 a GitHub Actions outage dropped the push
  # triggers outright: "Run Tests" was cancelled in the queue, so this workflow was
  # skipped, and a commit whose trigger is lost never gets one back. A dispatch
  # still went through when nothing else did.
  #
  # It deploys the current `main` WITHOUT the CI gate, so it is deliberate, not
  # routine: the pre-push hook already runs lint, format:check, check, test and
  # build locally, which is what makes this acceptable as a fallback path and not
  # as the normal one.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    # The dispatch branch is required: on a manual run `github.event.workflow_run`
    # does not exist, so the original condition alone would silently skip the job -
    # a deploy that reports success while deploying nothing.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The SAME pin as "Run Tests", and it must stay the same. Without this step
      # the job used whatever bun happened to be installed on the self-hosted box
      # (1.3.7), while the lockfile is written by 1.4.0 in `lockfileVersion: 2`:
      # the old bun cannot parse it, ignores it, and `--frozen-lockfile` turns
      # that into a fatal error. CI was green and the deploy failed on the same
      # commit, because the toolchain the deploy resolved was ambient machine
      # state that nothing declared.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # Facts about the box, printed BEFORE anything is cleaned, so the evidence
      # survives whatever the next step does to it. A clean container reproduces
      # this repo's install, build, deploy-copy and startup perfectly, so what
      # breaks production is machine state that nothing here declares - which is
      # exactly what this prints.
      - name: Machine facts
        run: |
          echo "bun: $(command -v bun) $(bun --version)"
          echo "--- disk ---";   df -h ~ | tail -2
          echo "--- memory ---"; free -m | head -3
          echo "--- bun install cache ---"
          du -sh ~/.bun/install/cache 2>/dev/null || echo "no cache dir"
          echo "--- what production currently holds ---"
          ls -la ~/portail-etu 2>&1 | head -15
          echo "build/: $(ls ~/portail-etu/build 2>/dev/null | wc -l) entries, node_modules/: $(ls ~/portail-etu/node_modules 2>/dev/null | wc -l) entries"

      # Install into a clean tree, from a cache this bun wrote. Everything else
      # has been eliminated as the cause of the production stall: the code, the
      # lockfile, the deploy copy, the runtime environment and the build itself
      # all reproduce perfectly in a clean bun 1.4.0 container, and the built
      # files on the box checksum identical to the ones built here. What the
      # container does that this box never did is start from nothing - this box
      # carries a 1.6 GB install cache written by bun 1.3.7, before setup-bun
      # replaced it, and node_modules built from it.
      #
      # Keeping the install clean is also what the deploy should have been doing
      # anyway: a deploy that inherits whatever the last one left behind is not
      # reproducible, and that is the whole property this workflow is meant to
      # have.
      - name: Install dependencies
        run: |
          echo "build/server aggregate before: n/a (pre-build)"
          rm -rf node_modules
          bun pm cache rm || true
          bun install --frozen-lockfile

      - name: Generate SvelteKit files
        run: bunx svelte-kit sync

      - name: Build application
        run: bun run build

      # Does it start where it was just built, before anything is copied? A clean
      # container runs this exact build in a second, so if it also runs here then
      # the fault is the copy or the target directory, and if it does not then it
      # is this machine. Nothing else separates those two.
      - name: Does the freshly built server start in place?
        run: |
          set +e
          started=$(date +%s)
          PORT=3997 timeout 40 bun ./build/index.js > /tmp/inplace.log 2>&1
          echo "in the build workspace: exit=$? elapsed=$(( $(date +%s) - started ))s bytes=$(stat -c %s /tmp/inplace.log)"
          grep -av -iE '(secret|token|password|api[_-]?key|authorization|bearer)' /tmp/inplace.log | head -10
          echo "precompressed assets: $(find build/client -name '*.br' | wc -l) br, $(find build/client -name '*.gz' | wc -l) gz"
          echo "symlinks under build/: $(find build/ -type l | wc -l)"
          echo "bun binary: $(readlink -f "$(command -v bun)")"
          set -e

      - name: Paste files to right location
        run: |
          cd ~/portail-etu
          # Wipe everything, including any stale hand-written .env: runtime
          # config is rewritten from GitHub Secrets in the next step, so the
          # server keeps no manual state and a fresh machine deploys identically.
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp ~/actions-runner/_work/refonte-portail-etu/refonte-portail-etu/* . -r

      - name: Write runtime environment from GitHub Secrets
        # Secrets are passed via env (masked in logs) rather than interpolated
        # into the script body. Bun auto-loads ~/portail-etu/.env at runtime, so
        # the pm2-launched server reads these without a rebuild. Empty values are
        # safe: the app code falls back to public defaults for the URLs and
        # disables the avatar proxy when GALLERY_API_KEY is unset.
        env:
          PUBLIC_CANARI_URL: ${{ secrets.PUBLIC_CANARI_URL }}
          GALLERY_API_URL: ${{ secrets.GALLERY_API_URL }}
          GALLERY_API_KEY: ${{ secrets.GALLERY_API_KEY }}
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
        run: |
          cd ~/portail-etu
          cat > .env <<EOF
          PUBLIC_CANARI_URL=${PUBLIC_CANARI_URL}
          GALLERY_API_URL=${GALLERY_API_URL}
          GALLERY_API_KEY=${GALLERY_API_KEY}
          PORTAL_URL=${PORTAL_URL}
          EOF

      - name: Restart server
        run: |
          cd ~/portail-etu
          pm2 restart ./ecosystem.config.cjs --update-env || pm2 start ./ecosystem.config.cjs

      # A deploy that only starts the process proves nothing. On 2026-08-26 every
      # step here reported success while the site served 502: pm2 prints `online`
      # the instant it spawns, so a process that crashes a second later still
      # leaves a green deploy behind, and the restart counter is the only thing on
      # that table that gives it away.
      #
      # This step is the report the deploy never had. It asks the app the one
      # question the whole deploy exists to answer - does it serve? - and when it
      # does not, it prints the crash that nothing else on this box can show,
      # because the runner is the only way in.
      - name: Verify the app actually answers
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/ || echo 000)
            if [ "$code" = "200" ]; then
              echo "The app answered 200 on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code}, retrying in 3s..."
            sleep 3
          done

          echo "::error::The app never answered 200. Last status: ${code}."

          # Ask the kernel, not the process. Whether anything holds :3000 is
          # immune to stdout buffering - a short console.log stays in bun's
          # buffer when stdout is a pipe and the process is killed before it
          # flushes, which is exactly how an earlier probe here read as "the app
          # prints nothing" when the real question was whether it ever binds.
          echo "--- who listens ---"
          ss -ltnp 2>/dev/null | head -20 || netstat -ltnp 2>/dev/null | head -20

          # Run it with stdout on a FILE, so nothing can be lost to buffering.
          echo "--- can bun run anything at all here? ---"
          cd ~/portail-etu
          bun -e 'console.log("inline code runs, bun is fine")' || echo "bun cannot even run inline code"

          echo "--- is this the build CI produced? ---"
          md5sum build/index.js build/handler.js 2>&1

          echo "--- how much CPU does this box have, and how busy is it? ---"
          echo "cpus=$(nproc) load=$(cut -d' ' -f1-3 /proc/loadavg)"

          # The process burns CPU rather than blocking, so the question is whether
          # it is slow or stuck. Fifteen seconds cannot tell those apart; a long
          # run can. If it prints its Listening line at some point, this is a
          # startup that outgrew the time pm2 and the health check allow it. If it
          # never does, it is a genuine infinite loop.
          echo "--- running the built server for up to 150s ---"
          started=$(date +%s)
          set +e
          PORT=3999 timeout 150 bun ./build/index.js > /tmp/probe.log 2>&1
          rc=$?
          set -e
          echo "exit=${rc} (124 = still running at the timeout) elapsed=$(( $(date +%s) - started ))s bytes=$(stat -c %s /tmp/probe.log)"
          grep -av -iE '(secret|token|password|api[_-]?key|authorization|bearer)' /tmp/probe.log | head -40

          echo "--- what is actually in build/ ---"
          ls -la build/ | head -12
          echo "build/server: $(du -sh build/server 2>/dev/null | cut -f1), $(find build/server -type f | wc -l) files"
          echo "build/server aggregate: $(find build/server -type f -exec md5sum {} + | sort -k2 | md5sum)"
          exit 1
