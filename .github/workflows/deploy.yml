name: Deploy to Server

on:
  workflow_run:
    workflows: ["Run Tests"]
    branches: [main]
    types:
      - completed
  # Manual escape hatch. On 2026-08-06 a GitHub Actions outage dropped the push
  # triggers outright: "Run Tests" was cancelled in the queue, so this workflow was
  # skipped, and a commit whose trigger is lost never gets one back. A dispatch
  # still went through when nothing else did.
  #
  # It deploys the current `main` WITHOUT the CI gate, so it is deliberate, not
  # routine: the pre-push hook already runs lint, format:check, check, test and
  # build locally, which is what makes this acceptable as a fallback path and not
  # as the normal one.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    # The dispatch branch is required: on a manual run `github.event.workflow_run`
    # does not exist, so the original condition alone would silently skip the job -
    # a deploy that reports success while deploying nothing.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Install bun with the official script rather than setup-bun, because this
      # box is a KVM guest whose CPU advertises no AVX2, and bun's ordinary
      # linux-x64 binary requires it. It does not fail cleanly without it: it
      # spins. That is what took production down for hours - the server burned
      # CPU forever inside its module load, before its first log line and before
      # it bound a port, while `bun -e` still worked because the trivial path
      # never reaches the vectorised code.
      #
      # The install script reads /proc/cpuinfo and picks bun-linux-x64-baseline
      # when AVX2 is missing. setup-bun does not, so pinning the version there
      # bought a reproducible toolchain and an unrunnable binary. The version is
      # still pinned - to the same 1.4.0 as "Run Tests" - and this also fixes the
      # runtime, since pm2 launches ~/.bun/bin/bun, the very binary written here.
      - name: Install the bun this CPU can run
        run: |
          # Name the baseline artifact instead of trusting a detection script.
          # This box is a KVM guest advertising no AVX2, and bun's ordinary
          # linux-x64 build needs it - without it, it does not fail, it spins,
          # forever, inside the module load and before any output. Which build is
          # on this machine is too load-bearing to be inferred.
          curl -fsSL -o /tmp/bun-baseline.zip             https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64-baseline.zip
          rm -rf /tmp/bun-baseline && mkdir -p /tmp/bun-baseline
          unzip -qo /tmp/bun-baseline.zip -d /tmp/bun-baseline
          mkdir -p "$HOME/.bun/bin"
          install -m 755 /tmp/bun-baseline/bun-linux-x64-baseline/bun "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          echo "installed $("$HOME/.bun/bin/bun" --version) (baseline) / avx2 on this cpu: $(grep -qm1 avx2 /proc/cpuinfo && echo yes || echo no)"

      - name: Install dependencies
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile

      - name: Generate SvelteKit files
        run: bunx svelte-kit sync

      - name: Build application
        run: bun run build

      # Prove the binary runs this build before pm2 is handed it. A server that
      # never binds is invisible to every step here except one that waits for its
      # first line, and that is exactly how this failure hid: pm2 said `online`,
      # the deploy said success, and the site said 502.
      - name: The built server must start
        run: |
          set +e
          PORT=3997 timeout 25 bun ./build/index.js > /tmp/start.log 2>&1
          rc=$?
          set -e
          if grep -q "Listening on" /tmp/start.log; then
            echo "It starts: $(grep -m1 'Listening on' /tmp/start.log)"
          else
            echo "::error::The built server never bound a port (exit ${rc}, $(stat -c %s /tmp/start.log) bytes of output)."
            grep -av -iE '(secret|token|password|api[_-]?key|authorization|bearer)' /tmp/start.log | head -20
            exit 1
          fi

      - name: Paste files to right location
        run: |
          cd ~/portail-etu
          # Wipe everything, including any stale hand-written .env: runtime
          # config is rewritten from GitHub Secrets in the next step, so the
          # server keeps no manual state and a fresh machine deploys identically.
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp ~/actions-runner/_work/refonte-portail-etu/refonte-portail-etu/* . -r

      - name: Write runtime environment from GitHub Secrets
        # Secrets are passed via env (masked in logs) rather than interpolated
        # into the script body. Bun auto-loads ~/portail-etu/.env at runtime, so
        # the pm2-launched server reads these without a rebuild. Empty values are
        # safe: the app code falls back to public defaults for the URLs and
        # disables the avatar proxy when GALLERY_API_KEY is unset.
        env:
          PUBLIC_CANARI_URL: ${{ secrets.PUBLIC_CANARI_URL }}
          GALLERY_API_URL: ${{ secrets.GALLERY_API_URL }}
          GALLERY_API_KEY: ${{ secrets.GALLERY_API_KEY }}
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
        run: |
          cd ~/portail-etu
          cat > .env <<EOF
          PUBLIC_CANARI_URL=${PUBLIC_CANARI_URL}
          GALLERY_API_URL=${GALLERY_API_URL}
          GALLERY_API_KEY=${GALLERY_API_KEY}
          PORTAL_URL=${PORTAL_URL}
          EOF

      - name: Restart server
        run: |
          cd ~/portail-etu
          pm2 restart ./ecosystem.config.cjs --update-env || pm2 start ./ecosystem.config.cjs

      # A deploy that only starts the process proves nothing. On 2026-08-26 every
      # step here reported success while the site served 502: pm2 prints `online`
      # the instant it spawns, so a process that crashes a second later still
      # leaves a green deploy behind, and the restart counter is the only thing on
      # that table that gives it away.
      #
      # This step is the report the deploy never had. It asks the app the one
      # question the whole deploy exists to answer - does it serve? - and when it
      # does not, it prints the crash that nothing else on this box can show,
      # because the runner is the only way in.
      - name: Verify the app actually answers
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/ || true)
            if [ "$code" = "200" ]; then
              echo "The app answered 200 on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code:-none}, retrying in 3s..."
            sleep 3
          done

          echo "::error::The app never answered 200. Last status: ${code:-none}."
          # pm2 reports `online` the instant it spawns a process, so its table is
          # not evidence that anything serves; the restart counter and the app's
          # own output are. There is no SSH to this box - printing them here is
          # the only way anyone sees them.
          pm2 describe portail-etu 2>&1 |
            grep -aiE 'status|restarts|uptime|script|exec cwd' || true
          pm2 logs portail-etu --nostream --lines 30 2>&1 |
            grep -av -iE '(secret|token|password|api[_-]?key|authorization|bearer)' || true
          exit 1
