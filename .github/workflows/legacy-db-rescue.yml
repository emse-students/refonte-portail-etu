# One-off recovery workflow for the LEGACY portail-etu database.
#
# WHY IT EXISTS: the new vitrine replaced the old application on the same host,
# and that host is only reachable through this self-hosted runner. There is no
# SSH access, so a manually dispatched job is the only way to make the box act.
#
# WHY IT IS NOT A ROUTE IN THE APP: a deployed endpoint would need the legacy
# database credentials inside a vitrine that has no database layer, and it stays
# exploitable for as long as it lives. A workflow_dispatch job runs only when a
# repo maintainer starts it, and leaves nothing behind.
#
# WHY THE ARCHIVE IS ENCRYPTED: anyone with read access to this repository can
# download an artifact and read a job log. The dump holds the personal data of
# every student the old portal ever had, so GitHub must never hold it in clear.
# Encryption is asymmetric on purpose - a passphrase input would be recorded in
# the run metadata, which is exactly the place the archive must be safe from.
#
# DELETE THIS FILE once the archive has been recovered and decrypted.
#
# ---------------------------------------------------------------------------
# HOW TO USE IT
#
# 1. Run it once in "discover" mode. It prints what the box runs, which database
#    tooling exists, which dump/sqlite files are lying around, and the KEY NAMES
#    (never the values) of every .env it finds. Read that report and derive the
#    exact dump command from it.
#
# 2. Locally, mint a throwaway recipient keypair. openssl's CMS/S-MIME encrypt
#    takes an X.509 CERTIFICATE, not a bare public key, so generate both halves:
#
#      openssl req -x509 -newkey rsa:4096 -nodes -days 7 \
#        -keyout legacy-rescue.key -out legacy-rescue.crt -subj "/CN=legacy-db-rescue"
#
#    Keep legacy-rescue.key on your machine and NEVER commit it. Paste the
#    contents of legacy-rescue.crt (the public half) into the recipient_cert
#    input - a certificate is public, so the run metadata recording it is fine.
#
# 3. Run it in "dump" mode with the command derived in step 1. Download the
#    artifact (it expires after one day) and decrypt it locally:
#
#      openssl smime -decrypt -inform DER -binary -in legacy-dump.enc \
#        -inkey legacy-rescue.key -recip legacy-rescue.crt -out legacy-dump.gz
#      gunzip legacy-dump.gz
#
# 4. Store the result outside this repository, or under data-export/ which is
#    gitignored. It is personal data: it must never be committed.

name: Legacy DB Rescue

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover = report what is on the host, nothing leaves it. dump = run dump_command and upload the encrypted result."
        required: true
        default: discover
        type: choice
        options:
          - discover
          - dump
      dump_command:
        description: "dump mode only. Shell command writing the archive to $DUMP. NEVER inline a password: this input is recorded in the run metadata, which any repo reader can see. Read credentials from a file on the host instead (for example mysqldump --defaults-file=...)."
        required: false
        type: string
      recipient_cert:
        description: "dump mode only. The PEM X.509 certificate the archive is encrypted to. Paste the whole -----BEGIN CERTIFICATE----- block."
        required: false
        type: string

# One rescue at a time: two concurrent runs would fight over the same host and
# the same temporary directory.
concurrency: legacy-db-rescue

jobs:
  rescue:
    name: Legacy DB Rescue
    # The legacy database lives on the deployment host, so the job must run
    # there. Nothing is checked out on purpose: the deploy workflow copies its
    # whole workspace into ~/portail-etu, so anything this job left in the
    # workspace would end up served publicly at the next deploy. Every file it
    # writes goes to RUNNER_TEMP instead.
    runs-on: self-hosted

    steps:
      - name: Report what is on this host
        if: inputs.mode == 'discover'
        # Deliberately not "set -e": a probe that fails (a missing tool, a
        # directory this account cannot read) is itself a finding, and must not
        # cut the report short. Values are never printed, only key names.
        run: |
          set -u
          say() { printf '\n===== %s =====\n' "$1"; }

          say "Host and account"
          hostname 2>&1 || true
          uname -a 2>&1 || true
          echo "runner account: $(whoami 2>&1) ($(id 2>&1))"
          echo "sudo: $(command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null && echo 'passwordless' || echo 'unavailable or needs a password')"

          say "Running services"
          systemctl list-units --type=service --state=running --no-pager --no-legend 2>/dev/null | awk '{print $1}' || echo "systemctl unavailable to this account"

          say "Listening sockets"
          ss -lntup 2>/dev/null || netstat -lntup 2>/dev/null || echo "neither ss nor netstat available"

          say "Tooling"
          for tool in mysql mysqldump mariadb mariadb-dump psql pg_dump pg_dumpall sqlite3 mongodump redis-cli docker podman bun node php python3 openssl gzip shred find; do
            path="$(command -v "$tool" 2>/dev/null || true)"
            printf '%-14s %s\n' "$tool" "${path:-MISSING}"
          done

          say "Containers"
          if command -v docker >/dev/null 2>&1; then
            docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>&1 || echo "docker is installed but not usable by this account"
          else
            echo "no docker"
          fi

          say "Database data directories"
          for dir in /var/lib/mysql /var/lib/postgresql /var/lib/mongodb; do
            if [ -d "$dir" ]; then ls -la "$dir" 2>&1 | head -n 40; else echo "$dir absent"; fi
          done

          say "Application roots"
          for dir in /var/www /srv /opt /home; do
            if [ -d "$dir" ]; then echo "-- $dir"; ls -la "$dir" 2>&1 | head -n 40; fi
          done

          say "Dump and sqlite candidates (size, mtime, path)"
          find /var/www /srv /opt /home /var/backups -maxdepth 6 \
            \( -name node_modules -o -name .git -o -name .cache -o -name .svelte-kit \) -prune -o \
            -type f \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' -o -name '*.sql' -o -name '*.sql.gz' -o -name '*.dump' -o -name '*.tar.gz' \) \
            -printf '%10s  %TY-%Tm-%Td  %p\n' 2>/dev/null | sort -k2 | head -n 200

          say "Scheduled jobs"
          crontab -l 2>&1 | head -n 40 || true
          ls -la /etc/cron.d 2>/dev/null | head -n 20 || true

          say "pm2 processes"
          pm2 list 2>&1 | head -n 40 || echo "no pm2 for this account"

          say "Credential files (presence only, never contents)"
          for file in "$HOME/.my.cnf" "$HOME/.pgpass" /etc/mysql/debian.cnf /root/.my.cnf; do
            if [ -e "$file" ]; then ls -l "$file" 2>&1; else echo "$file absent"; fi
          done

          say "Environment files (KEY NAMES ONLY, values redacted)"
          find /var/www /srv /opt /home -maxdepth 5 \
            \( -name node_modules -o -name .git \) -prune -o \
            -type f \( -name '.env' -o -name '.env.*' -o -name 'settings.php' -o -name 'wp-config.php' -o -name 'config.inc.php' \) -print 2>/dev/null \
            | head -n 40 | while IFS= read -r file; do
              printf '\n-- %s\n' "$file"
              sed -n 's/^[[:space:]]*\(export[[:space:]]*\)\?\([A-Za-z_][A-Za-z0-9_]*\)[[:space:]]*=.*/  \2/p' "$file" 2>/dev/null | sort -u | head -n 60 || echo "  unreadable by this account"
            done

          echo
          echo "Report complete. Derive the dump command from the above, then dispatch this workflow in dump mode."

      - name: Check the dump inputs
        if: inputs.mode == 'dump'
        env:
          DUMP_COMMAND: ${{ inputs.dump_command }}
          RECIPIENT_CERT: ${{ inputs.recipient_cert }}
        run: |
          set -eu
          if [ -z "${DUMP_COMMAND:-}" ]; then
            echo "dump mode needs a dump_command. Run discover mode first and derive it from the report."
            exit 1
          fi
          if [ -z "${RECIPIENT_CERT:-}" ]; then
            echo "dump mode needs a recipient_cert. Without it the archive would be uploaded in clear, which is exactly what this workflow exists to prevent."
            exit 1
          fi
          echo "Both inputs present."

      - name: Dump, encrypt, and wipe the plaintext
        if: inputs.mode == 'dump'
        # The inputs are passed through the environment rather than interpolated
        # into the script body: splicing them in would let a dispatcher inject
        # YAML-level shell instead of merely running a command, and would put the
        # command itself in the rendered log.
        env:
          DUMP_COMMAND: ${{ inputs.dump_command }}
          RECIPIENT_CERT: ${{ inputs.recipient_cert }}
          WORK: ${{ runner.temp }}/legacy-rescue-${{ github.run_id }}
        run: |
          set -eu

          # Overwrite before unlinking: the plaintext dump is personal data and
          # this host is not ours to leave it on.
          wipe() {
            for file in "$@"; do
              [ -e "$file" ] || continue
              if command -v shred >/dev/null 2>&1; then
                shred -fuz "$file" 2>/dev/null || rm -f "$file"
              else
                rm -f "$file"
              fi
            done
          }

          rm -rf "$WORK"
          mkdir -p "$WORK"
          chmod 700 "$WORK"

          printf '%s\n' "$RECIPIENT_CERT" > "$WORK/recipient.pem"
          echo "Encrypting to:"
          openssl x509 -in "$WORK/recipient.pem" -noout -subject -enddate -fingerprint -sha256

          # The dump command contract: write the archive to $DUMP, nothing else.
          export DUMP="$WORK/legacy-dump"
          set +e
          sh -c "$DUMP_COMMAND"
          dump_status=$?
          set -e
          if [ "$dump_status" -ne 0 ]; then
            echo "dump_command exited with status $dump_status"
            wipe "$DUMP"
            exit "$dump_status"
          fi
          if [ ! -s "$DUMP" ]; then
            echo "dump_command succeeded but wrote nothing to \$DUMP ($DUMP)."
            exit 1
          fi
          echo "Plaintext dump: $(wc -c < "$DUMP") bytes"

          gzip -9 -c "$DUMP" > "$DUMP.gz"
          wipe "$DUMP"

          openssl smime -encrypt -binary -aes-256-cbc \
            -in "$DUMP.gz" -out "$WORK/legacy-dump.enc" -outform DER \
            "$WORK/recipient.pem"
          wipe "$DUMP.gz" "$WORK/recipient.pem"

          echo "Encrypted archive: $(wc -c < "$WORK/legacy-dump.enc") bytes"
          echo "sha256: $(sha256sum "$WORK/legacy-dump.enc" | cut -d' ' -f1)"
          echo "Only the encrypted file remains on this host, and the last step removes it too."

      - name: Upload the encrypted archive
        if: inputs.mode == 'dump'
        uses: actions/upload-artifact@v7
        with:
          name: legacy-db-${{ github.run_id }}
          path: ${{ runner.temp }}/legacy-rescue-${{ github.run_id }}/legacy-dump.enc
          # One day is enough to download it, and short enough that a forgotten
          # artifact does not sit in the org's storage.
          retention-days: 1
          if-no-files-found: error

      - name: Wipe the working directory
        # always(): a failed dump must not leave a half-written plaintext file
        # behind, and a cancelled run least of all.
        if: always() && inputs.mode == 'dump'
        env:
          WORK: ${{ runner.temp }}/legacy-rescue-${{ github.run_id }}
        run: |
          set -u
          [ -d "$WORK" ] || { echo "nothing to wipe"; exit 0; }
          find "$WORK" -type f -exec shred -fuz {} + 2>/dev/null || true
          rm -rf "$WORK"
          echo "Working directory removed."
