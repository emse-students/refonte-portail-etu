# Stated, never inferred. Sans cette ligne le nom du projet Compose est le nom du DOSSIER ou le
# fichier se trouve - et ce dossier a deja change une fois, quand le runner a quitte un
# compte personnel pour un compte de service. Les deux dossiers
# s appelaient "portail-etu", donc le projet est reste le meme; par coincidence, pas par ecrit. Un
# dossier nomme autrement aurait cree un SECOND projet a cote, laissant l ancien conteneur tourner
# et repondre.
name: portail-etu

services:
  portail-etu:
    build: .
    container_name: portail-etu
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      # Written by deploy.yml from GitHub Secrets on every release, same as before.
      - .env
    environment:
      # The adapter has NO runtime ORIGIN: the public origin is https:// + the request Host
      # header, so the reverse proxy MUST forward Host (`proxy_set_header Host $host`).
      # See docs/wiki/architecture.md ("The origin comes from the Host header").
      BODY_SIZE_LIMIT: "10485760" # 10MB
