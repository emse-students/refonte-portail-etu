# Stated, never inferred. Sans cette ligne le nom du projet Compose est le nom du DOSSIER ou le
# fichier se trouve - et ce dossier vient de changer, de /home/muselli/portail-etu vers
# /opt/actions-runner/portail-etu, quand le runner a quitte un compte personnel. Les deux
# s appellent "portail-etu", donc le projet est reste le meme; par coincidence, pas par ecrit. Un
# dossier nomme autrement aurait cree un SECOND projet a cote, laissant l ancien conteneur tourner
# et repondre.
name: portail-etu

services:
  portail-etu:
    build: .
    container_name: portail-etu
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      # Written by deploy.yml from GitHub Secrets on every release, same as before.
      - .env
    environment:
      # Read by the adapter at request time via $env/dynamic - no rebuild needed
      # to change either. See docs/wiki/architecture.md on why ORIGIN matters
      # for canonical URLs and the sitemap.
      ORIGIN: "https://portail-etu.emse.fr"
      BODY_SIZE_LIMIT: "10485760" # 10MB
